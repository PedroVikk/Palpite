# Deploy gratuito no Render: https://render.com
# 1. Suba este repositorio no GitHub
# 2. Render > New > Blueprint > aponte para o repo
# O plano free hiberna apos 15 min sem uso (o primeiro acesso demora ~30s).
services:
  - type: web
    name: palpite
    runtime: node
    plan: free
    # explicito de proposito: a branch padrao do repositorio ainda e a Java,
    # que nao tem o cliente React nem o script de build
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
