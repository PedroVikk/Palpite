<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1E8D6">
<script>
  // o tema salvo entra antes da primeira pintura: sem isto a pagina nasceria no
  // Sepia e trocaria de cor na cara da pessoa quando o React subisse.
  // A lista espelha client/src/lib/theme.js.
  (function () {
    var themes = {
      sepia: ['light', '#F1E8D6'],
      crepusculo: ['dark', '#191724'],
      manga: ['light', '#F7F3EA'],
      mesa: ['dark', '#0E3B33'],
      fliperama: ['dark', '#120B24'],
    };
    var id = null;
    try { id = localStorage.getItem('palpite:tema'); } catch (e) { /* storage bloqueado */ }
    if (!themes[id]) id = 'sepia';
    var root = document.documentElement;
    root.setAttribute('data-theme', id);
    root.setAttribute('data-scheme', themes[id][0]);
    document.querySelector('meta[name=theme-color]').setAttribute('content', themes[id][1]);
  })();
</script>
<title>Palpite — Quem é esse?</title>
<meta name="description" content="Adivinhe o secreto em turnos com os amigos, em vinte e dois temas.">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23ef4444'/><text x='50' y='72' font-size='62' font-weight='bold' text-anchor='middle' fill='%23fff' font-family='sans-serif'>?</text></svg>">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
